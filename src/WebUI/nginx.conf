# MESNET — Frontend Nginx
# Reverse proxy arkasında çalışır; sadece Vue SPA statik dosyalarını sunar.
# API ve SSE trafiği reverse proxy tarafından doğrudan backend'e yönlendirilir —
# bu container'a /api/ isteği gelmez.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Statik varlıklar için uzun cache (Vite content-hash dosya adları üretir)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history mode — tüm route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
