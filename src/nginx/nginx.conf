# MESNET — Reverse Proxy Nginx
# İnternet trafiğini frontend ve backend container'larına yönlendirir.
# Production'da bu container 80 ve 443 portlarını dinler.
#
# Container isimleri (docker-compose service adlarıyla eşleşmeli):
#   mesnet-frontend  → Nginx (Vue static dist), port 80
#   mesnet-api       → MESNET.Presentation (.NET 10), port 8080

# --- Upstream Tanımları ---

upstream frontend {
    server mesnet-frontend:80;
}

upstream backend {
    server mesnet-api:8080;
}

# --- HTTP → HTTPS Yönlendirme ---

server {
    listen 80;
    server_name _;

    # ACME / Let's Encrypt doğrulama için istisnai path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Diğer tüm HTTP trafiğini HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Reverse Proxy ---

server {
    listen 443 ssl;
    server_name mesnet.example.com;  # Production domain ile değiştir

    # TLS sertifikaları (Let's Encrypt / Certbot)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Güvenli TLS ayarları
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Güvenlik başlıkları
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # İstek boyutu limiti (belge/dekont yüklemeleri için)
    client_max_body_size 20m;

    # --- SSE Endpoint (önce eşleşmeli — daha spesifik path) ---

    location /api/notifications/stream {
        proxy_pass http://backend/api/notifications/stream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # SSE için kritik — buffering kapalı, uzun bağlantı
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Backend API ---

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # Timeout (uzun süren PDF üretimi vb. için)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Frontend (Vue SPA) — tüm diğer trafik ---

    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
