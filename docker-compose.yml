services:

  # ── Reverse Proxy + Static (Caddy) ─────────────────────────────
  # Otomatik HTTPS. Web (Vue SPA) + Docs static'i gömülü sunar; /api → api,
  # auth.${APP_DOMAIN} → keycloak, docs.${APP_DOMAIN} → docs static.
  caddy:
    build:
      context: .
      dockerfile: src/caddy/Dockerfile
      args:
        # Vite public config build zamanında gömülür (bkz. src/caddy/Dockerfile)
        VITE_KEYCLOAK_URL: https://auth.${APP_DOMAIN}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-mesnet}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-mesnet-web}
        VITE_OSRM_URL: ${VITE_OSRM_URL:-}
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # ÖLÇÜLDÜ: Caddy'ye BOŞ değer geçmek "acme_ca" direktifini argümansız bırakır ve Caddy
      # HİÇ AÇILMAZ ("wrong argument count ... after 'acme_ca'"). Caddyfile'daki {$VAR:default}
      # sözdizimi yalnız TANIMSIZ değişkende devreye girer, boş string'te DEĞİL. Varsayılan bu
      # yüzden burada da verilir: .env'de satır olmasa da, boş bırakılsa da üretim LE gelir.
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - caddy-data:/data      # ACME sertifikaları (kalıcı — yeniden başlatmada yeniden almaz)
      - caddy-config:/config
    depends_on:
      - api
      - keycloak
    restart: unless-stopped

  # ── Backend API (.NET 10) ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/MESNET.Presentation/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL (PostGIS destekli) ──────────────────────────────
  postgres:
    image: kartoza/postgis:18-3.6
    environment:
      POSTGRES_DB: mesnet
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d mesnet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── RabbitMQ ───────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    expose:
      - "5672"
    ports:
      - "15672:15672"    # Management UI — production'da kapat veya güvenli hale getir
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Keycloak ───────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mesnet
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      # Caddy TLS'i uçta sonlandırır, container'a düz HTTP gelir.
      # `KC_PROXY: edge` Keycloak 26.0.0'da KALDIRILDI — yerine proxy-headers + http-enabled.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # 26.x bootstrap admin adları; KEYCLOAK_ADMIN/_PASSWORD eski (deprecated) adlar.
      # .github/compose.ci.yml ile aynı anahtarlar kullanılır.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    expose:
      - "8080"    # Yalnız iç ağ; dışarıya auth.${APP_DOMAIN} üzerinden Caddy açar
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── MinIO ──────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
    ports:
      - "9001:9001"    # MinIO Console — production'da kapat
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  caddy-data:      # Caddy ACME sertifikaları (kalıcı)
  caddy-config:
