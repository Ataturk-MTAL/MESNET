# Sürüm konteynerleri — bir tag (v*) push edildiğinde deploy edilebilir bileşenlerin
# imajlarını derler ve GHCR'ye push eder. Depo PRIVATE olduğundan imajlar da PRIVATE'tır
# (public yayınlanmaz). Bkz. VERSIONING.md.
name: Release Containers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # elle tetikleme (varsayılan branch'ten)

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api # .NET API (Presentation) — context kök (MESNET.slnx + src/)
            context: .
            dockerfile: src/MESNET.Presentation/Dockerfile
          - name: web # Quasar/Vue frontend
            context: src/WebUI
            dockerfile: src/WebUI/Dockerfile
          - name: nginx # reverse proxy
            context: src/nginx
            dockerfile: src/nginx/Dockerfile
          - name: docs # Docusaurus dokümantasyon sitesi
            context: src/Docs
            dockerfile: src/Docs/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Owner'ı küçük harfe çevir (GHCR küçük harf ister)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: GHCR'ye giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: İmaj etiketleri (metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/mesnet-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Derle ve GHCR'ye push (private)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
