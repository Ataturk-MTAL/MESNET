# Sürüm konteynerleri — bir tag (v*) push edildiğinde deploy edilebilir bileşenlerin
# imajlarını derler ve GHCR'ye push eder. Depo PRIVATE olduğundan imajlar da PRIVATE'tır
# (public yayınlanmaz). Bkz. VERSIONING.md.
name: Release Containers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # elle tetikleme (varsayılan branch'ten)

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api # .NET API (Presentation) — context kök (MESNET.slnx + src/)
            context: .
            dockerfile: src/MESNET.Presentation/Dockerfile
          - name: caddy # Caddy: Vue SPA + Docusaurus static gömülü + reverse proxy — context kök
            context: .
            dockerfile: src/caddy/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # node24 (v4 node20 deprecate ediliyordu); docker/* action'ları henüz node20 (Docker güncelleyince node24'e geçecek)

      - name: Owner'ı küçük harfe çevir (GHCR küçük harf ister)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: GHCR'ye giriş
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: İmaj etiketleri (metadata)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/mesnet-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Buildx kur
        uses: docker/setup-buildx-action@v3

      # Caddy imajı Vite public config'i build zamanında gömer. Domain deploy'a özeldir;
      # repo değişkenlerinden al (yoksa Dockerfile default'u 'https://auth.localhost').
      - name: Caddy build-args hesapla
        id: bargs
        if: matrix.name == 'caddy'
        run: |
          {
            echo "args<<EOF"
            echo "VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL || (vars.APP_DOMAIN && format('https://auth.{0}', vars.APP_DOMAIN)) || 'https://auth.localhost' }}"
            echo "VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM || 'mesnet' }}"
            echo "VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'mesnet-web' }}"
            echo "VITE_OSRM_URL=${{ vars.VITE_OSRM_URL }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Derle ve GHCR'ye push (private)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.bargs.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
